[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-beacon"
version = "1.0.0"
description = "Zero-dependency liveness sentinel, heartbeat monitor, and dead-man's switch watchdog for autonomous AI agents and background workers"
readme = "README.md"
authors = [{ name = "Nymrel / JalenBuilds LLC", email = "contact@jalenbuilds.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

[project.scripts]
agent-beacon = "agent_beacon.cli:main"

[project.urls]
Homepage = "https://github.com/nymrel/agent-beacon"
Repository = "https://github.com/nymrel/agent-beacon.git"
Issues = "https://github.com/nymrel/agent-beacon/issues"
